name: Bug report
description: Something exported wrong, crashed, or looked broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pixport version
      description: Help → About, or `pixport --version`
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS (Apple silicon), macOS (Intel), Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Release download, pip / pipx, From source]
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile and format
      placeholder: "e.g. Windows icon (.ico), or Convert / resize → WEBP"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Attach the source image if you can; SVGs that render wrongly are the most useful bug reports.
